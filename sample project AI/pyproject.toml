[project]
name = "agent-platform"
version = "0.1.0"
description = "Chat service, orchestrator, specialized agents, and ticketing MCP"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.2.14",
    "langchain-core>=0.2.43",
    "langchain-openai>=0.1.25",
    "langserve>=0.2.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
cassandra = ["cassandra-driver>=3.29.0"]

[project.scripts]
agent-chat = "agent_platform.chat.main:main"
agent-mcp-ticketing = "agent_platform.mcp.ticketing_server:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
